server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: jede Route (z.B. /kontakt, /app/angebote/12) liefert index.html aus,
    # React Router übernimmt danach clientseitig das Routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets mit Hash im Dateinamen dürfen lange gecacht werden
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
